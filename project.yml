name: Presence
options:
  bundleIdPrefix: com.chung
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hant
packages:
  PresenceCore:
    path: Packages/PresenceCore
  PresenceLink:
    path: Packages/PresenceLink
  # Mac 版在 App Store 外發佈，用 Sparkle 自動更新
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 52A8DH7GF9
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "4"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development: WEICHUNG LAI (C2R6HR9R2C)"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application: WEICHUNG LAI (52A8DH7GF9)"
targets:
  Presence:
    type: application
    platform: macOS
    sources:
      - Presence
      # SMAppService.agent 要在 Contents/Library/LaunchAgents 找到設定檔
      - path: LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: PresenceCore
      - package: PresenceLink
      - package: Sparkle
    info:
      path: Presence/Info.plist
      properties:
        CFBundleDisplayName: Presence
        # 原文是繁體中文，但其他語言的使用者要退回英文
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # Sparkle：更新清單放在 GitHub Releases 最新一版；公鑰對應鑰匙圈裡的 EdDSA 私鑰
        SUFeedURL: https://github.com/chung223/Presence/releases/latest/download/appcast.xml
        SUPublicEDKey: 61QuEiWz6gHy9PaRTLGpSU3CWFauyxH9OIpwb+O78z4=
        SUEnableAutomaticChecks: true
        LSUIElement: true
        # 一直在背景監控：不能讓系統在沒有視窗時自動把它關掉（那算正常結束，launchd 不會重開）
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSBluetoothAlwaysUsageDescription: Presence 用藍牙偵測你的手機或手錶在不在附近，決定要鎖定還是解鎖這台 Mac。
        NSCameraUsageDescription: 開啟「拍照存證」後，裝置不在附近時有人手動解鎖這台 Mac，Presence 會拍一張照片存在這台 Mac 上。
        NSHumanReadableCopyright: © 2026 Weichung Lai. MIT License.
    entitlements:
      path: Presence/Presence.entitlements
      properties:
        com.apple.security.device.bluetooth: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  PresenceRemote:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Remote]
    dependencies:
      - package: PresenceLink
      # 手錶 App 要包在 iPhone App 裡，WatchConnectivity 才會認得兩者是一組
      - target: PresenceRemoteWatch
      - target: PresenceRemoteWidgets
    info:
      path: Remote/Info.plist
      properties:
        CFBundleDisplayName: Presence Remote
        # 原文是繁體中文，但其他語言的使用者要退回英文
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Presence Remote 用藍牙連到你 Mac 上的 Presence，從手機鎖定或查看狀態。
        NSCameraUsageDescription: 用相機掃描 Mac 上 Presence 顯示的配對 QR code。
        # 出口合規：只用 Apple CryptoKit 的標準加密保護自己裝置之間的藍牙指令，2026-10-14 使用者選擇豁免
        ITSAppUsesNonExemptEncryption: false
        PresenceSharedKeychainGroup: $(AppIdentifierPrefix)com.chung.presence.remote.shared
    entitlements:
      path: Remote/PresenceRemote.entitlements
      properties:
        # 第一個是 App 自己的（配對金鑰預設存這裡，小工具讀不到）；第二個與小工具共用最新狀態（SharedStatusStore）
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.chung.presence.remote
          - $(AppIdentifierPrefix)com.chung.presence.remote.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence.remote
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PresenceRemoteWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - RemoteWidgets
      # 小工具的按鈕用同一組動作；實際由 App 執行（LiveActivityIntent）
      - Remote/Intents
    dependencies:
      - package: PresenceLink
    info:
      path: RemoteWidgets/Info.plist
      properties:
        CFBundleDisplayName: Presence Remote
        # 原文是繁體中文，但其他語言的使用者要退回英文
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        PresenceSharedKeychainGroup: $(AppIdentifierPrefix)com.chung.presence.remote.shared
    entitlements:
      path: RemoteWidgets/PresenceRemoteWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.chung.presence.remote.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence.remote.widgets
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PresenceRemoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [Watch]
    dependencies:
      - package: PresenceLink
      - target: PresenceRemoteWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Presence
        # 原文是繁體中文，但其他語言的使用者要退回英文
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.chung.presence.remote
        NSBluetoothAlwaysUsageDescription: Presence 用藍牙連到你 Mac 上的 Presence，從手錶鎖定或查看狀態。
        PresenceSharedKeychainGroup: $(AppIdentifierPrefix)com.chung.presence.remote.shared
    entitlements:
      path: Watch/PresenceRemoteWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.chung.presence.remote.watchkitapp
          - $(AppIdentifierPrefix)com.chung.presence.remote.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence.remote.watchkitapp
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PresenceRemoteWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [WatchWidgets]
    dependencies:
      - package: PresenceLink
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Presence
        # 原文是繁體中文，但其他語言的使用者要退回英文
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        PresenceSharedKeychainGroup: $(AppIdentifierPrefix)com.chung.presence.remote.shared
    entitlements:
      path: WatchWidgets/PresenceRemoteWatchWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.chung.presence.remote.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence.remote.watchkitapp.widgets
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
