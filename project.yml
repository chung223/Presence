name: Presence
options:
  bundleIdPrefix: com.chung
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hant
packages:
  PresenceCore:
    path: Packages/PresenceCore
  PresenceLink:
    path: Packages/PresenceLink
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 52A8DH7GF9
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development: WEICHUNG LAI (C2R6HR9R2C)"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application: WEICHUNG LAI (52A8DH7GF9)"
targets:
  Presence:
    type: application
    platform: macOS
    sources:
      - Presence
      # SMAppService.agent 要在 Contents/Library/LaunchAgents 找到設定檔
      - path: LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: PresenceCore
      - package: PresenceLink
    info:
      path: Presence/Info.plist
      properties:
        CFBundleDisplayName: Presence
        # 原文是繁體中文，但其他語言的使用者要退回英文
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        # 一直在背景監控：不能讓系統在沒有視窗時自動把它關掉（那算正常結束，launchd 不會重開）
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSBluetoothAlwaysUsageDescription: Presence 用藍牙偵測你的手機或手錶在不在附近，決定要鎖定還是解鎖這台 Mac。
        NSCameraUsageDescription: 開啟「拍照存證」後，裝置不在附近時有人手動解鎖這台 Mac，Presence 會拍一張照片存在這台 Mac 上。
        NSHumanReadableCopyright: © 2026 Weichung Lai. MIT License.
    entitlements:
      path: Presence/Presence.entitlements
      properties:
        com.apple.security.device.bluetooth: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  PresenceRemote:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Remote]
    dependencies:
      - package: PresenceLink
      # 手錶 App 要包在 iPhone App 裡，WatchConnectivity 才會認得兩者是一組
      - target: PresenceRemoteWatch
    info:
      path: Remote/Info.plist
      properties:
        CFBundleDisplayName: Presence Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Presence Remote 用藍牙連到你 Mac 上的 Presence，從手機鎖定或查看狀態。
        NSCameraUsageDescription: 用相機掃描 Mac 上 Presence 顯示的配對 QR code。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence.remote
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PresenceRemoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [Watch]
    dependencies:
      - package: PresenceLink
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Presence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.chung.presence.remote
        NSBluetoothAlwaysUsageDescription: Presence 用藍牙連到你 Mac 上的 Presence，從手錶鎖定或查看狀態。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.presence.remote.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
